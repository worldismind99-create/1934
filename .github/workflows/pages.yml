# 通勤調整判定ツール(commute-adjustment/)を GitHub Pages に公開する。
#
# 初回実行時に configure-pages が Pages 自体を有効化するため、
# リポジトリの Settings を手で触る必要はない。
# 公開されるのは commute-adjustment/ の中身だけで、サーバー側のコードは含まない。
#
# 注意: プライベートリポジトリでも、公開された Pages サイトは
# インターネット上の誰でも閲覧できる状態になる(アクセス制御は Enterprise プランのみ)。
# 公開したくない場合は、このワークフローを削除するか、push トリガーを外して
# workflow_dispatch(手動実行)だけにすること。

name: Deploy commute-adjustment to Pages

on:
  push:
    branches: [claude/instagram-integration-yn8trb]
    paths:
      - 'commute-adjustment/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイは中断せず、後続をまとめて1回にする
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages を設定する(未設定なら有効化する)
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 上で "Resource not accessible by integration" が出たときのために、
      # 何を直せばよいかをログにそのまま出しておく
      - name: 有効化できなかった場合の直し方を表示する
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages を有効化できませんでした。次のどちらかです。"
          echo ""
          echo "1) ワークフローのトークンが読み取り専用になっている"
          echo "   Settings > Actions > General > Workflow permissions を"
          echo "   'Read and write permissions' に変更してから、このワークフローを再実行する。"
          echo ""
          echo "2) このプランでは private リポジトリで Pages が使えない"
          echo "   Settings > Pages を開くと表示される。リポジトリを public にするか、"
          echo "   GitHub Pro 以上にするか、commute-adjustment/ を別のサーバーに置く。"
          echo ""
          echo "アプリ自体はこのワークフローとは無関係に動く。commute-adjustment/ の"
          echo "ファイル一式をどこに置いても、そのまま同じように使える。"
          exit 1

      - name: アプリのフォルダだけをアップロードする
        uses: actions/upload-pages-artifact@v3
        with:
          path: commute-adjustment

      - name: デプロイする
        id: deployment
        uses: actions/deploy-pages@v4
