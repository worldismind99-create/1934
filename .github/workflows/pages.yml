# 通勤調整判定ツール(commute-adjustment/)を GitHub Pages に公開する。
#
# 公開経路は2つあり、リポジトリの状態に合う方を選ぶ。
#
#  A) gh-pages ブランチ方式(設定1か所で済む・こちらが既定)
#     Settings > Pages > Source を "Deploy from a branch" にして
#     gh-pages ブランチの / (root) を選ぶだけ。GitHub側がビルドするので、
#     このワークフローもActionsのトークン権限も不要。
#     アプリを更新したら gh-pages ブランチにも反映すること。
#
#  B) このワークフロー方式(Actions から公開する)
#     Settings > Actions > General > Workflow permissions が
#     "Read and write permissions" である必要がある。読み取り専用だと
#     configure-pages が "Resource not accessible by integration" で失敗する。
#     条件が整ってから、Actions の画面で手動実行する。
#
# どちらの経路でも、公開されるのは commute-adjustment/ の中身だけで、
# サーバー側のコードは含まない。
#
# 注意: プライベートリポジトリでも、公開された Pages サイトは
# インターネット上の誰でも閲覧できる状態になる(アクセス制御は Enterprise プランのみ)。
# なお Free プランでは、そもそも private リポジトリで Pages を使えない。

name: Deploy commute-adjustment to Pages

# 経路Bが使える状態になってから手動で実行する。
# 条件が整っていない間に毎push失敗しないよう、自動トリガーは付けていない。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイは中断せず、後続をまとめて1回にする
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages を設定する(未設定なら有効化する)
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 上で "Resource not accessible by integration" が出たときのために、
      # 何を直せばよいかをログにそのまま出しておく
      - name: 有効化できなかった場合の直し方を表示する
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages を有効化できませんでした。次のどちらかです。"
          echo ""
          echo "1) ワークフローのトークンが読み取り専用になっている"
          echo "   Settings > Actions > General > Workflow permissions を"
          echo "   'Read and write permissions' に変更してから、このワークフローを再実行する。"
          echo ""
          echo "2) このプランでは private リポジトリで Pages が使えない"
          echo "   Settings > Pages を開くと表示される。リポジトリを public にするか、"
          echo "   GitHub Pro 以上にすること。"
          echo ""
          echo "設定を触らずに公開したい場合は、経路A(gh-pages ブランチ方式)を使う。"
          echo "Settings > Pages > Source を 'Deploy from a branch' にして"
          echo "gh-pages ブランチの / (root) を選ぶだけでよい。"
          exit 1

      - name: アプリのフォルダだけをアップロードする
        uses: actions/upload-pages-artifact@v3
        with:
          path: commute-adjustment

      - name: デプロイする
        id: deployment
        uses: actions/deploy-pages@v4
